# Ingestion sirene (SPEC.md §7.3) : lancée par un ordonnanceur externe, jamais au démarrage d'un serveur.
# Base de données : SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD (rôle suivons_ingestion).
spring:
  application:
    name: suivons-ingestion-sirene
  main:
    web-application-type: none
  batch:
    job:
      enabled: false
    jdbc:
      # Métadonnées Spring Batch dans ops, créées par les migrations (V3__spring_batch.sql)
      initialize-schema: never
      table-prefix: ops.BATCH_
  jooq:
    sql-dialect: postgres

logging:
  structured:
    format:
      console: ecs

suivons:
  referentiel:
    sirene:
      # Clé du plan « Accès public » de l'API Sirene, jamais versionnée
      cle-api: ${INSEE_API_KEY:}
  naf:
    # Empreintes SHA-256 relevées le 2026-09-28 : un fichier republié par l'INSEE est refusé jusqu'à vérification
    fichiers:
      - nomenclature: NAFRev2
        url: https://www.insee.fr/fr/statistiques/fichier/2120875/naf2008_liste_n5.xls
        feuille: Feuil1
        sha256: 76088b7b66dc72e106ec047902069f3744237acb9f249ca3f3b98c273bf3785b
      - nomenclature: NAF2025
        url: https://www.insee.fr/fr/statistiques/fichier/8181066/Structure%20NAF%202025%20Maj%202024-10-04.xlsx
        feuille: Sous-classes
        sha256: 6bbb9b9affc7d547f7b2b4a790043d6c942362d743bf38377d5e32bd7ceba2d7
