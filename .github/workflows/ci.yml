# Intégration continue (SPEC.md §10) : build, TU, ArchUnit, TI, lint et TS front, dépendances.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '25'

jobs:
  back:
    name: Back (build, TU, ArchUnit, TI)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
      - name: Build, TU, ArchUnit, validation du contrat
        run: ./gradlew build
      - name: TI (Testcontainers PostgreSQL)
        run: ./gradlew integrationTest
      - name: Commande de migration dédiée (ADR 0005), appliquée puis rejouée
        run: |
          docker compose up -d --wait db
          ./gradlew :db:migrate
          ./gradlew :db:migrate
          docker compose down -v
      - name: Code jOOQ généré à jour
        run: |
          ./gradlew :db:generateJooq
          if [ -n "$(git status --porcelain db/src/main/jooq)" ]; then
            echo "::error::Code jOOQ désynchronisé des migrations : lancer ./gradlew :db:generateJooq et commiter."
            git status --porcelain db/src/main/jooq
            exit 1
          fi
      - name: Rapports de tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rapports-back
          path: '**/build/reports/tests/'
          retention-days: 7

  contrat:
    name: Contrat (lint OpenAPI)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: front/.nvmrc
      - name: Lint Redocly
        run: npx --yes @redocly/cli@2.54.3 lint --config contract/redocly.yaml contract/openapi.yaml

  front:
    name: Front (lint, TU, TS)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v7
      # Java : génération du client d'API depuis le contrat (npm run generate:api)
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: front/.nvmrc
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: TU (Vitest)
        run: npm test
      - name: Navigateur Playwright
        run: npx playwright install --with-deps chromium
      - name: TS (Playwright + axe-core)
        run: npm run e2e
      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rapport-playwright
          path: front/playwright-report/
          retention-days: 7

  parcours:
    name: Parcours (recette locale, TS)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      # Exactement le chemin de la recette locale (docs/demarrer-en-local.md) : tout est construit dans Docker
      - name: Recette locale, démarrage (suivons.sh demarrer)
        run: ./suivons.sh demarrer
      - name: Recette locale, jeu de démonstration (suivons.sh demo)
        run: ./suivons.sh demo
      - uses: actions/setup-node@v7
        with:
          node-version-file: front/.nvmrc
          cache: npm
          cache-dependency-path: front/package-lock.json
      - name: Dépendances des TS
        working-directory: front
        run: npm ci
      - name: Navigateur Playwright
        working-directory: front
        run: npx playwright install --with-deps chromium
      - name: TS du parcours (Playwright + axe-core)
        working-directory: front
        run: npm run e2e:parcours
      - name: Journaux de la stack
        if: failure()
        run: docker compose --profile stack logs
      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rapport-parcours
          path: front/playwright-report-parcours/
          retention-days: 7

  script-windows:
    name: Recette locale (script Windows)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Windows PowerShell 5.1, celui des postes : encodage (BOM), fins de ligne et syntaxe du script, menu d'aide.
      # Docker (conteneurs Linux) n'est pas disponible sur les exécuteurs Windows : la stack est testée par le job parcours.
      - name: Encodage, fins de ligne et syntaxe
        shell: powershell
        run: |
          $octets = [System.IO.File]::ReadAllBytes('scripts\suivons.ps1')
          if ($octets[0] -ne 0xEF -or $octets[1] -ne 0xBB -or $octets[2] -ne 0xBF) { throw 'suivons.ps1 doit être en UTF-8 avec BOM' }
          foreach ($fichier in 'scripts\suivons.ps1', 'suivons.cmd') {
            if (-not ([System.IO.File]::ReadAllText($fichier).Contains("`r`n"))) { throw "$fichier doit avoir des fins de ligne Windows" }
          }
          $erreurs = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts\suivons.ps1'), [ref]$null, [ref]$erreurs) | Out-Null
          if ($erreurs.Count -gt 0) { $erreurs; throw 'Erreurs de syntaxe dans suivons.ps1' }
      - name: Menu d'aide (suivons.cmd)
        shell: cmd
        run: suivons.cmd aide > aide.txt && type aide.txt && findstr /C:"recette locale" aide.txt

  dependances:
    name: Dépendances (vulnérabilités, licences)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      # Graphe des dépendances Gradle transmis à GitHub (alertes Dependabot, revue de PR).
      # Les runs Dependabot n'ont qu'un jeton en lecture : pas d'envoi possible, la revue porte alors
      # sur les manifestes lus directement par GitHub (npm, actions) et sur le graphe de main.
      - uses: gradle/actions/dependency-submission@v6
        if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
      - uses: actions/setup-node@v7
        with:
          node-version-file: front/.nvmrc
      - name: Vulnérabilités npm (dépendances d'exécution)
        working-directory: front
        run: npm audit --omit=dev --audit-level=high
      # Bloque une PR qui introduit une vulnérabilité élevée ou une licence incompatible avec l'AGPL-3.0
      # (identifiants SPDX uniquement : la « Commons Clause » n'en a pas et ne peut pas être listée)
      - name: Revue des dépendances
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          retry-on-snapshot-warnings: true
          # Commentaire impossible avec le jeton en lecture des runs Dependabot
          comment-summary-in-pr: ${{ github.actor != 'dependabot[bot]' && 'on-failure' || 'never' }}
          deny-licenses: >-
            GPL-1.0-only, GPL-2.0-only, LGPL-2.0-only, SSPL-1.0, BUSL-1.1, Elastic-2.0,
            CC-BY-NC-1.0, CC-BY-NC-2.0, CC-BY-NC-2.5, CC-BY-NC-3.0, CC-BY-NC-4.0,
            CC-BY-NC-SA-4.0, CC-BY-NC-ND-4.0, JSON
