# Mises à jour des dépendances : une PR groupée par écosystème et par semaine.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /front
    schedule:
      interval: weekly
    ignore:
      # TypeScript suit la plage imposée par Angular (22.x : >=6.0 <6.1) : monté avec Angular, jamais seul
      - dependency-name: typescript
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # Types Node alignés sur la version majeure de Node du projet (.nvmrc : 24)
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      angular:
        patterns: ['@angular/*', '@angular-devkit/*', 'angular-eslint']
      npm:
        patterns: ['*']
        exclude-patterns: ['@angular/*', '@angular-devkit/*', 'angular-eslint']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
