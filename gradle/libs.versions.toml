# Catalogue de versions — figé au lot 0 (2026-09-26), voir CLAUDE.md § Versions.
# Règle : une bibliothèque gérée par le BOM Spring Boot n'est pas versionnée ici,
# elle suit le BOM (cohérence des versions testées ensemble par Spring).
# Versions de référence du BOM Spring Boot 4.1.1 (pour information, ne pas dupliquer) :
#   Spring Framework 7.0.9, Spring Batch 6.0.5, jOOQ 3.21.7, Flyway 12.4.0,
#   Testcontainers 2.0.5, JUnit Jupiter 6.0.3, AssertJ 3.27.7, pilote PostgreSQL 42.7.13.

[versions]
java = "25"
spring-boot = "4.1.1"
archunit = "1.5.1"
resilience4j = "2.4.0"
wiremock = "3.13.2"
swagger-request-validator = "3.0.0"
# Lecture des fichiers de nomenclature NAF de l'INSEE (.xls et .xlsx)
poi = "5.5.1"
# Lecture des exports Parquet (DECP)
duckdb = "1.5.6.0"
openapi-generator = "7.25.0"
# Image PostgreSQL des TI et du codegen jOOQ ; à garder égale à docker-compose.yml
postgres-image = "18.6"
# Image Flyway de la commande de migration (production, docker-compose) : même version que Flyway du BOM
flyway-image = "12.4.0-alpine"

[libraries]
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
# Pour build-logic (plugins de convention)
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
openapi-generator-gradle-plugin = { module = "org.openapitools:openapi-generator-gradle-plugin", version.ref = "openapi-generator" }

# Gérées par le BOM Spring Boot (pas de version)
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-batch-jdbc = { module = "org.springframework.boot:spring-boot-starter-batch-jdbc" }
spring-boot-starter-jooq = { module = "org.springframework.boot:spring-boot-starter-jooq" }
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }
spring-boot-test = { module = "org.springframework.boot:spring-boot-test" }
flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
jooq = { module = "org.jooq:jooq" }
jooq-codegen = { module = "org.jooq:jooq-codegen" }
jooq-meta = { module = "org.jooq:jooq-meta" }
postgresql = { module = "org.postgresql:postgresql" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
testcontainers-junit = { module = "org.testcontainers:testcontainers-junit-jupiter" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj = { module = "org.assertj:assertj-core" }
# Compilation des interfaces générées par le contrat (module contract)
spring-web = { module = "org.springframework:spring-web" }
spring-context = { module = "org.springframework:spring-context" }
jakarta-validation = { module = "jakarta.validation:jakarta.validation-api" }
jakarta-annotation = { module = "jakarta.annotation:jakarta.annotation-api" }
jakarta-servlet = { module = "jakarta.servlet:jakarta.servlet-api" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations" }
snakeyaml = { module = "org.yaml:snakeyaml" }
# Clients HTTP des API d'appui (referentiel-client)
spring-boot = { module = "org.springframework.boot:spring-boot" }
jackson-databind = { module = "tools.jackson.core:jackson-databind" }
caffeine = { module = "com.github.ben-manes.caffeine:caffeine" }

# Hors BOM Spring Boot
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
resilience4j-circuitbreaker = { module = "io.github.resilience4j:resilience4j-circuitbreaker", version.ref = "resilience4j" }
resilience4j-retry = { module = "io.github.resilience4j:resilience4j-retry", version.ref = "resilience4j" }
resilience4j-ratelimiter = { module = "io.github.resilience4j:resilience4j-ratelimiter", version.ref = "resilience4j" }
# Variante autonome (dépendances ombrées) : évite le conflit Jetty avec Spring Boot 4
wiremock = { module = "org.wiremock:wiremock-standalone", version.ref = "wiremock" }
duckdb-jdbc = { module = "org.duckdb:duckdb_jdbc", version.ref = "duckdb" }
poi-ooxml = { module = "org.apache.poi:poi-ooxml", version.ref = "poi" }
swagger-request-validator = { module = "com.atlassian.oai:swagger-request-validator-core", version.ref = "swagger-request-validator" }

