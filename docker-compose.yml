# Environnement local de développement (SPEC.md §7.4). Identifiants de dev uniquement.
# Version de l'image : à garder égale à `postgres-image` dans gradle/libs.versions.toml.
services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-suivons}
      POSTGRES_USER: ${POSTGRES_USER:-suivons}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-suivons}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Commande de migration dédiée (ADR 0005), avec l'image Flyway officielle : c'est la forme utilisée en
  # production. `docker compose run --rm migrate` (profil outils, jamais démarré par `up`).
  # Version de l'image : à garder égale à `flyway-image` dans gradle/libs.versions.toml.
  migrate:
    image: flyway/flyway:12.4.0-alpine
    profiles: [outils]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./db/src/main/resources/db/migration:/flyway/migrations:ro
    command:
      - -url=jdbc:postgresql://db:5432/${POSTGRES_DB:-suivons}
      - -user=${POSTGRES_USER:-suivons}
      - -password=${POSTGRES_PASSWORD:-suivons}
      - -locations=filesystem:/flyway/migrations
      - -cleanDisabled=true
      - migrate

  # Stack complète (profil `stack`) : API et front SSR, sur des artefacts construits au préalable :
  #   ./gradlew :api:bootJar && (cd front && npm run build) && docker compose --profile stack up -d --build
  # Base migrée par `./gradlew :db:migrate` (ou le service migrate) ; jeu de démonstration : fixtures/demo/parcours.sql
  api:
    build: ./api
    profiles: [stack]
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-suivons}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-suivons}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-suivons}
      INSEE_API_KEY: ${INSEE_API_KEY:-}
    ports:
      - "${API_PORT:-8080}:8080"

  front:
    build: ./front
    profiles: [stack]
    depends_on:
      - api
    environment:
      API_URL: http://api:8080
      # Hôtes acceptés par le rendu serveur (protection SSRF d'Angular)
      NG_ALLOWED_HOSTS: localhost
    ports:
      - "${FRONT_PORT:-4000}:4000"

volumes:
  pgdata:
